
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InnPet | Salud y bienestar animal</title>

    <link rel="stylesheet" href="home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HERO PRINCIPAL -->
    <section class="hero">

        <!-- DECORACIONES -->
        <div class="decoration orange-top"></div>
        <div class="decoration green-top"></div>

        <!-- CONTENIDO -->
        <div class="hero-content">


            <!-- TÍTULO -->
            <h1>
                Ellos también
                <span class="orange-text">son familia</span>
                <span class="heart">♡</span>
            </h1>

            <!-- DESCRIPCIÓN -->
            <p class="hero-description">
                Brindamos atención veterinaria integral
                para que tu mascota viva sana, feliz
                y siempre a tu lado.
            </p>

            <!-- BOTONES -->
            <div class="hero-buttons">

                <a href="#turnos" class="btn-primary">
                    <span class="calendar-icon">▦</span>
                    contactanos 
                </a>

                <a href="#servicios" class="btn-secondary">
                    Conocé nuestros servicios
                    <span>→</span>
                </a>

            </div>

            <!-- TEXTO INFERIOR -->
            <div class="hero-trust">
                <span>✦</span>
                Amor, cuidado y salud en cada consulta.
            </div>

        </div>

        <!-- IMAGEN DE LAS MASCOTAS -->
        <div class="hero-image">

            <img src="imageninnpet.png" alt="Perro y gato de InnPet">

            <div class="image-overlay"></div>

        </div>

        <!-- DETALLES DECORATIVOS -->
        <div class="small-lines">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </section>

</body>
</html>
